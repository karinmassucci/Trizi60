<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REVELLE — Base de Protocolos</title></head><body><script>(async()=>{const base="https://raw.githubusercontent.com/karinmassucci/Trizi60/main/revelle-temp/";const names=["c1.txt","c2.txt","c3.txt","c4.txt","c5.txt","c6.txt","c7.txt"];const parts=await Promise.all(names.map(n=>fetch(base+n).then(r=>r.text())));const s=atob(parts.join("").trim()),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close();})();</script></body></html>
